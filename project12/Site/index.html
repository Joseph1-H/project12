<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymLink Social</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVIGATION WITH LOGO/TITLE -->
    <nav>
        <div class="nav-logo">GYMLINK</div>
        <ul>
            <li><a href=""><i class="fas fa-home"></i> Home</a></li>
            <li><a href=""><i class="fas fa-search"></i> Search</a></li>
            <li><a href=""><i class="fas fa-dumbbell"></i> Workouts</a></li>
            <li><a href=""><i class="fas fa-user"></i> Profile</a></li>
        </ul>
    </nav>

    <!-- LAYOUT -->
    <div class="layout">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar left">
            <h3>Your Account</h3>
            <ul>
                <li class="btn"><i class="fas fa-user-circle"></i> Your Profile</li>
                <li class="btn"><i class="fas fa-users"></i> Friends</li>
                <li class="btn"><i class="fas fa-bell"></i> Notifications</li>
                <li class="btn"><i class="fas fa-cog"></i> Settings</li>
            </ul>
        </aside>

        <!-- MAIN FEED -->
        <main class="feed">
            <div class="empty-feed">
                <i class="fas fa-dumbbell"></i>
                <h2>No posts yet</h2>
                <p>Once you or your friends complete a workout, it will appear here for you.</p>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar right">
            <h3>People You May Know</h3>
            <div class="suggestion-box btn">
                <div class="circle"></div>
                <div class="text-lines">
                    <div class="line"></div>
                    <div class="line short"></div>
                </div>
            </div>

            <div class="suggestion-box btn">
                <div class="circle"></div>
                <div class="text-lines">
                    <div class="line"></div>
                    <div class="line short"></div>
                </div>
            </div>
        </aside>

    </div>

</body>
</html>
